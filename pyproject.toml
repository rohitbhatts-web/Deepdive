[project]
name = "deepdive"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.153.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.16",
    "openai>=3.35.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
