# Render Blueprint for the hosted RECORDED demo (read-only; no provider keys). Nothing is deployed until you sync the Blueprint or deploy in Render.
# One Docker web service, ONE instance. The demo database is built into the image (see Dockerfile) and opened read-only from /app/demo-db.
# The 1 GB disk at /data is the previous version's storage: this version neither reads nor writes it. It stays attached so its database is kept
# for a rollback (removing a disk from a service deletes its data). See docs/HOSTING.md, "Deploying this version" and "Rollback".
services:
  - type: web
    name: deepdive-demo
    runtime: docker
    plan: starter
    region: oregon
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    autoDeployTrigger: "off"
    disk:
      name: deepdive-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PUBLIC_READ_ONLY
        value: "1"
      - key: DATABASE_PATH
        value: /app/demo-db/deepdive-demo.db
